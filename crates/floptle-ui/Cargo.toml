[package]
name = "floptle-ui"
description = "In-game UI (docs/ui-system-proposal.md): element tree, Free/Pin/Stack layout, draw-list builder. Renderer-agnostic leaf crate by design."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
# Style sheets and token files ARE RON assets, and they need the implicit-some
# extension turned on to be pleasant to hand-edit (see style::parse_ron). That
# knowledge belongs with the types it parses, not in whoever loads them — so
# `ron` graduates from a dev-dependency here. Still a leaf crate: no engine
# dependencies, no renderer.
ron = { workspace = true }
