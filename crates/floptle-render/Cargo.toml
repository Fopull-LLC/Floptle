[package]
name = "floptle-render"
description = "Renderer: wgpu render graph, materials, and the signature SDF/raymarch look."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floptle-core = { path = "../floptle-core" }
floptle-field = { path = "../floptle-field" }
floptle-gi = { path = "../floptle-gi" }
floptle-rules = { path = "../floptle-rules" }
floptle-ui = { path = "../floptle-ui" }

glam = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
# Game-UI text: tiny pure-Rust TTF rasterizer feeding the ui pass's glyph atlas.
fontdue = "0.9"

[dev-dependencies]
# Offscreen render tests (examples/blob_probe.rs) write PNGs to inspect the look.
png = "0.18"
# examples/shader_probe.rs compiles .flsl through the production path.
floptle-shader = { path = "../floptle-shader" }
# examples/ui_demo_probe.rs renders a real .ron scene's UI layer, so the demo
# is checked as the FILE the editor loads rather than as a Rust rebuild of it.
floptle-scene = { path = "../floptle-scene" }
# examples/nav_overlay_probe.rs draws a real bake, because "is this navmesh
# readable" is a question about a picture and only a picture answers it.
floptle-nav = { path = "../floptle-nav" }
# examples/model_shot.rs renders a real .glb through the production importer, so
# the picture a package ships is the model the editor would load.
floptle-assets = { path = "../floptle-assets" }
# …and the same example runs the demo's OWN Lua, so the `ui.make` panel in the
# picture is the one the game builds rather than a Rust restatement of it.
floptle-script = { path = "../floptle-script" }
floptle-core = { path = "../floptle-core" }
ron = { workspace = true }
