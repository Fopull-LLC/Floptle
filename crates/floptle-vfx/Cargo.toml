[package]
name = "floptle-vfx"
description = "Timeline-based particle/VFX system: groups, emit events, per-property curves."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floptle-core = { path = "../floptle-core" }
# `default-features = false`: floptle-render's default is a script VM, for its
# own tests only (ADR-0028). Carrying it here would put a second VM in the graph
# of anything that selects the other one.
floptle-render = { path = "../floptle-render", default-features = false }

[dev-dependencies]
# Offscreen probe (examples/vfx_probe.rs) renders the deterministic sim to PNGs.
wgpu = { workspace = true }
png = "0.18"
