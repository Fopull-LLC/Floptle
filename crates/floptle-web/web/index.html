<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
  /* The page is the game's. Nothing here is the engine's look: a black ground,
     the canvas filling it, and one panel that exists until the game starts. */
  html, body { margin: 0; height: 100%; background: #000; color: #d8d8e0; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
  /* A finger over the game is the game's. Without these, a drag on a phone
     scrolls or pulls the page to refresh, two fingers zoom it, a double tap
     zooms in and a long press opens a menu or selects text. */
  html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { display: block; width: 100vw; height: 100vh; outline: none; background: #000; touch-action: none; }
  #panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; }
  #panel[hidden] { display: none; }
  #title { font-size: 22px; letter-spacing: 0.02em; color: #fff; }
  #bar { width: min(420px, 80vw); height: 6px; background: #1c1c24; border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #d8d8e0; transition: width 120ms linear; }
  /* Working, with no fraction to show: a sliver that keeps crossing the bar.
     A transform animation runs on the browser's compositor, so it keeps
     moving while the engine holds the page for a long step — which is the
     moment a still bar would read as a stalled one. */
  #bar.busy #fill { width: 30% !important; transition: none; animation: busy 1.1s ease-in-out infinite; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(334%); } }
  #panel.leaving { opacity: 0; transition: opacity 250ms ease-out; pointer-events: none; }
  #status { color: #8a8a96; min-height: 1.5em; text-align: center; max-width: 80vw; white-space: pre-wrap; }
  #play { display: none; font: inherit; font-size: 16px; padding: 10px 28px; border: 1px solid #d8d8e0; border-radius: 4px; background: transparent; color: #fff; cursor: pointer; }
  #play:hover { background: #d8d8e0; color: #000; }
  #play.ready { display: inline-block; }
  #crash { display: none; max-width: min(520px, 90vw); text-align: center; color: #8a8a96; }
  #crash.shown { display: block; }
  #crash button { font: inherit; margin-top: 6px; padding: 4px 14px; border: 1px solid #5a5a66; border-radius: 4px; background: transparent; color: #d8d8e0; cursor: pointer; }
  #crash textarea { display: none; width: 100%; height: 30vh; margin-top: 8px; background: #101016; color: #d8d8e0; border: 1px solid #2a2a34; font: 12px/1.4 ui-monospace, monospace; -webkit-user-select: text; user-select: text; }
  #crash.open textarea { display: block; }
  a { color: #d8d8e0; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="panel">
  <div id="title">{{TITLE}}</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">loading…</div>
  <button id="play">▶ Play</button>
  <div id="crash">The game stopped unexpectedly last time.<br><button id="crashShow">Show what it said</button><textarea id="crashText" readonly></textarea></div>
</div>
<script type="module">
  const $ = id => document.getElementById(id);

  // What the game said last, kept where a crash cannot take it. A tab the
  // browser closes for memory, or a GPU process that dies, ends the page
  // with no event and no log: the console goes with it. So the last lines
  // are written to the page's storage as they happen (at most once a
  // second, at once for anything fatal), and a run that ends properly marks
  // itself ended. One that never did is shown on the next visit, and
  // `window.floptleLastCrash()` hands it to a script that wants to send it.
  const recordKey = 'floptle:lastRun:' + location.pathname;
  const record = { running: true, stopped: '', lines: [] };
  let unsaved = false;
  const saveRun = () => {
    unsaved = false;
    try { localStorage.setItem(recordKey, JSON.stringify(record)); } catch (e) { /* storage off or full */ }
  };
  const crumb = (line, now) => {
    record.lines.push(`${new Date().toISOString().slice(11, 23)} ${line}`);
    if (record.lines.length > 200) record.lines.splice(0, record.lines.length - 200);
    if (now) saveRun(); else unsaved = true;
  };
  let lastRun = null;
  try { lastRun = JSON.parse(localStorage.getItem(recordKey) || 'null'); } catch (e) { /* none, or unreadable */ }
  const lastCrash = lastRun && (lastRun.running || lastRun.stopped)
    ? `${lastRun.stopped || 'The page ended without closing: the browser stopped it, most often for memory.'}\n\n${(lastRun.lines || []).join('\n')}`
    : null;
  window.floptleLastCrash = () => lastCrash;
  saveRun();
  setInterval(() => { if (unsaved) saveRun(); }, 1000);
  addEventListener('pagehide', () => { record.running = false; saveRun(); });
  addEventListener('pageshow', e => { if (e.persisted) { record.running = true; saveRun(); } });
  for (const level of ['warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => { crumb(`${level}: ${args.join(' ')}`, level === 'error'); original(...args); };
  }
  addEventListener('unhandledrejection', e => crumb(`unhandled: ${(e.reason && e.reason.stack) || e.reason}`, true));
  const status = s => { $('status').textContent = s; };
  const fill = f => { $('fill').style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; };
  const busy = on => $('bar').classList.toggle('busy', on);
  // The panel's three states: loading (up, bar moving), failed (up, the
  // reason in place of the bar), and gone once the engine says the game is on
  // screen. Once failed it stays failed; a late "ready" does not hide the
  // reason the player needs to read.
  let failed = false, shown = false;
  const fail = why => {
    // **Show the panel.** Anything that goes wrong once the game is on
    // screen — and losing the GPU adapter is the common one, on a Linux
    // Chrome without the WebGPU flag or a blocklisted card — would otherwise
    // write its explanation into a hidden element, and the player would get a
    // black page that named nothing, which is exactly the failure this panel
    // exists to prevent.
    failed = true;
    record.stopped = why;
    crumb(why, true);
    $('panel').hidden = false;
    $('panel').classList.remove('leaving');
    $('play').classList.remove('ready');
    busy(false);
    status(why);
    $('bar').style.visibility = 'hidden';
    console.error(why);
  };

  // `?shot=N`: photograph frame N and hand it to the harness — the browser's
  // form of the player's `--shot`, and how a web build is verified by eye. It
  // is also the only thing that puts this page under the harness at all.
  const shotAt = Number(new URLSearchParams(location.search).get('shot')) || 0;

  // The engine's own console, and the page's way to tell the player it stopped.
  // Under tools/web/shot.py --game, both are also POSTed to the harness.
  //
  // Only there. These used to POST unconditionally, which is a request per log
  // line — at least twice a second — to a path no real host serves: a shipped
  // game filled its host's access log with 404s and its own network tab with
  // failures, all of it for a harness that was not listening.
  const post = (path, body) =>
    shotAt > 0 ? fetch(path, { method: 'POST', body }).catch(() => {}) : Promise.resolve();
  window.floptleLog = s => { console.log(s); crumb(s); post('/report', s); };
  window.floptleFatal = s => { fail('The game stopped:\n' + s); post('/report', 'FATAL ' + s); };
  // The browser took the graphics device back. To a player that is the end
  // of the game, and they are told. Under the harness it is a line and the
  // run goes on: a headless browser takes the device from a page about ten
  // seconds in, and a long run there measures everything but the picture.
  window.floptleDeviceLost = s => {
    if (shotAt > 0) { crumb(s, true); post('/report', 'DEVICE LOST ' + s); } else window.floptleFatal(s);
  };
  // The engine's boot, step by step. The panel stays up from the Play click
  // until `floptleReady`: the engine still has a graphics device to get, the
  // project to open and the world to load, and every second of that used to
  // be a black page with nothing on it saying the game was on its way.
  const since = () => `${(performance.now() / 1000).toFixed(2)} s`;
  // The engine's memory: one block the browser grows and never shrinks, so
  // its size is the most it has ever needed. A phone closes a tab that holds
  // too much; this is the number to watch against that.
  let heap = () => 0;
  const mb = n => (n / 1048576).toFixed(1);
  window.floptleStatus = s => {
    if (failed || shown) return;
    status(s);
    crumb(`loading: ${s} (engine memory ${mb(heap())} MB)`);
    console.log(`loading: ${s}`);
    post('/report', `page ${since()}: ${s} (engine memory ${mb(heap())} MB)`);
  };
  window.floptleReady = () => {
    if (failed || shown) return;
    shown = true;
    post('/report', `page ${since()}: the game is on screen (engine memory ${mb(heap())} MB)`);
    const panel = $('panel');
    panel.classList.add('leaving');
    setTimeout(() => {
      if (!failed) { panel.hidden = true; panel.classList.remove('leaving'); busy(false); }
    }, 300);
    $('game').focus();
  };
  // Fullscreen for the game, from `app.setFullscreen`. A browser grants it
  // only inside a tap or a click, and the game asks from its own frame: on a
  // phone that is usually too late, so a refused request is made again inside
  // the player's next tap. iPhone Safari has no fullscreen for a page at all,
  // and then this does nothing. The canvas, as the window's own request
  // would, so `app.fullscreen()` keeps answering truthfully.
  window.floptleFullscreen = on => {
    const el = $('game');
    if (!on) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) {
        Promise.resolve(exit.call(document)).catch(() => {});
      }
      return;
    }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    Promise.resolve(req.call(el, { navigationUI: 'hide' })).catch(() => {
      window.addEventListener('pointerup', () => {
        Promise.resolve(req.call(el, { navigationUI: 'hide' })).catch(() => {});
      }, { once: true, capture: true });
    });
  };
  // A trap inside the engine that is not a Rust panic (the scripting VM's C++
  // aborting, say) never reaches `floptleFatal`, and would leave the loading
  // bar moving over a game that has stopped. Only the engine's own errors,
  // and only while the panel is up: a page's other scripts are not ours.
  window.addEventListener('error', e => {
    crumb(`error: ${e.message || e.error}`, true);
    const ours = e.error instanceof WebAssembly.RuntimeError || String(e.filename || '').includes('/pkg/');
    if (ours && !shown && !failed) fail('The game stopped while loading:\n' + (e.message || e.error));
  });
  // The picture comes from the engine's own render target, not the canvas: a
  // WebGPU canvas hands `toDataURL` a blank image outside the task that drew it.
  // wgpu reports a rejected buffer map as one fixed sentence and drops the
  // browser's own reason, which is the only diagnostic there is. Keep it.
  if (window.GPUBuffer) {
    const mapAsync = GPUBuffer.prototype.mapAsync;
    GPUBuffer.prototype.mapAsync = function (...args) {
      const p = mapAsync.apply(this, args);
      p.catch(e => window.floptleLog(`mapAsync rejected: ${e.name}: ${e.message} (usage=${this.usage} size=${this.size})`));
      return p;
    };
  }
  window.floptleShotAt = () => shotAt;
  if (shotAt > 0) {
    // Under the harness, say whether this window is one the browser animates
    // at all: a compositor that hides a new window starves it of frames, and
    // a game that never gets a frame looks like a game that never booted.
    let raf = 0;
    const tick = () => { raf++; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    setInterval(() => post('/report', `page: ${document.visibilityState}, ${raf} animation frames so far, engine memory ${mb(heap())} MB`), 5000);
  }
  // The canvas, read inside the frame that drew it (the engine calls this
  // straight after presenting). Outside that task a WebGPU canvas reads
  // blank, and a mapped readback is aborted by a headless browser, so this is
  // the picture's first route and the readback below its fallback.
  //
  // A browser that does not composite the canvas (a headless one) hands back
  // a blank picture without complaint, and a blank picture reported as the
  // game's would pass a check it should fail. So it is copied to a 2D canvas
  // here, in the same task, and a picture with no two pixels different is
  // turned down: the readback gets its turn, and failing that the harness is
  // told plainly that there is no picture.
  window.floptleCaptureCanvas = () => {
    try {
      const src = $('game');
      const c = document.createElement('canvas');
      c.width = src.width; c.height = src.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(src, 0, 0);
      const px = ctx.getImageData(0, 0, c.width, c.height).data;
      // A real frame is opaque somewhere and has more in it than dither
      // noise; a canvas the browser never composited is transparent, with the
      // dither's 0/1 left in it.
      let lo = 255, hi = 0, opaque = false;
      for (let i = 0; i < px.length; i += 4 * 97) {
        const l = px[i] + px[i + 1] + px[i + 2];
        lo = Math.min(lo, l); hi = Math.max(hi, l);
        opaque = opaque || px[i + 3] > 0;
      }
      if (!opaque || hi - lo < 24) {
        post('/report', 'canvas capture: the canvas reads as one flat colour here — trying the readback');
        return false;
      }
      post('/shot', c.toDataURL('image/png')).then(() => post('/report', 'SHOT SENT'));
      return true;
    } catch (e) {
      post('/report', `canvas capture failed: ${e}`);
      return false;
    }
  };
  window.floptleCapture = async (rgba, w, h) => {
    if (!w || !h) {
      // The readback did not complete — a headless browser aborts the map.
      await post('/report', 'CAPTURE FAILED — the frame could not be read back');
      return;
    }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba), w, h), 0, 0);
    await post('/shot', c.toDataURL('image/png'));
    await post('/report', 'SHOT SENT');
  };

  // Every file the page loads, as an absolute address beside the page's
  // files. A site can serve this page from one address and its files from
  // another, with a <base> tag saying where the files are. Safari, and every
  // browser on an iPhone, ignores <base> for a relative import() and for this
  // script's import.meta.url, and asks for the engine beside the page
  // instead. document.baseURI honours <base> everywhere.
  const here = path => new URL(path, document.baseURI).href;

  if (lastCrash) {
    post('/report', `LAST RUN STOPPED: ${lastCrash.split('\n')[0]}`);
    $('crash').classList.add('shown');
    $('crashShow').addEventListener('click', () => {
      $('crash').classList.toggle('open');
      $('crashText').value = lastCrash;
      $('crashText').select();
      if (navigator.clipboard) navigator.clipboard.writeText(lastCrash).catch(() => {});
    });
  }

  // Two things a browser must have, checked up front and named when missing,
  // rather than a blank canvas: WebGPU (the renderer's only backend on the
  // web), and WebAssembly exception handling (the scripting engine's C++
  // throws through it).
  if (!navigator.gpu) {
    fail('This browser has no WebGPU. The game needs a current Chrome, Edge or Safari; in Firefox, WebGPU is still rolling out.');
  } else if (!('WebAssembly' in window)) {
    fail('This browser has no WebAssembly.');
  } else {
    run().catch(e => fail(String((e && e.stack) || e)));
  }

  // Hand control back to the browser for one painted frame. A status set
  // just before a long synchronous call is otherwise never seen: the page
  // cannot paint until the call returns.
  const painted = () => new Promise(r => requestAnimationFrame(() => setTimeout(r)));

  async function run() {
    // The glue first (a few kilobytes), so its own failure to load is
    // reported as itself.
    busy(true);
    status('loading…');
    const { default: init, play } = await import(here('pkg/floptle_web.js'));
    // Then the engine and the game together, on one bar. Both are large —
    // the engine's module is tens of megabytes — and the engine's used to
    // download under a bare "loading…" with the bar standing still.
    const [wasmRes, gameRes] = await Promise.all([
      fetch(here('pkg/floptle_web_bg.wasm')),
      fetch(here('game.flpk')),
    ]);
    if (!wasmRes.ok) throw new Error(`floptle_web_bg.wasm: HTTP ${wasmRes.status}`);
    if (!gameRes.ok) throw new Error(`game.flpk: HTTP ${gameRes.status}`);
    // A host that compresses on the fly either does not say how many bytes
    // are coming or states the compressed count while the body arrives
    // decompressed. Either way there is no fraction to show, and the bar
    // shows activity instead.
    const size = r => {
      const enc = r.headers.get('Content-Encoding');
      return enc && enc !== 'identity' ? 0 : Number(r.headers.get('Content-Length')) || 0;
    };
    const sizes = [size(wasmRes), size(gameRes)];
    const total = sizes.every(n => n > 0) ? sizes[0] + sizes[1] : 0;
    busy(!total);
    let got = 0;
    const progress = n => {
      got += n;
      if (total && got <= total) {
        fill(got / total);
        status(`downloading the game… ${mb(got)} / ${mb(total)} MB`);
      } else {
        busy(true);
        status(`downloading the game… ${mb(got)} MB`);
      }
    };
    // The engine's module is counted on its way into the compiler rather
    // than read first, so it still compiles as it streams in.
    const counted = new Response(
      wasmRes.body.pipeThrough(new TransformStream({ transform(c, out) { progress(c.length); out.enqueue(c); } })),
      { headers: { 'Content-Type': 'application/wasm' } },
    );
    // The game, into one buffer the engine reads from where it is. With its
    // size known, straight into a buffer of that size: holding the pieces
    // and joining them made a second whole copy of the game at the moment
    // the page needed the most memory, and a phone closes a page for that.
    const readGame = async () => {
      const reader = gameRes.body.getReader();
      const want = sizes[1];
      if (want) {
        const bytes = new Uint8Array(want);
        let at = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          if (at + value.length > want) throw new Error(`game.flpk: more than the ${want} bytes the server said`);
          bytes.set(value, at);
          at += value.length;
          progress(value.length);
        }
        if (at !== want) throw new Error(`game.flpk: ${at} of ${want} bytes arrived`);
        return bytes;
      }
      const chunks = [];
      let n = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        n += value.length;
        progress(value.length);
      }
      const bytes = new Uint8Array(n);
      let at = 0;
      for (const c of chunks) { bytes.set(c, at); at += c.length; }
      return bytes;
    };
    const [wasm, bytes] = await Promise.all([init({ module_or_path: counted }), readGame()]);
    heap = () => wasm.memory.buffer.byteLength;
    // The engine's memory, into the record each time it grows: the line
    // before a page the browser closed for memory says how much it held.
    let heapSeen = 0;
    setInterval(() => {
      if (heap() !== heapSeen) { heapSeen = heap(); crumb(`engine memory ${mb(heapSeen)} MB`); }
    }, 2000);
    busy(false);
    fill(1);
    // A click before the game starts, on purpose: browsers allow sound only
    // after the player has interacted with the page, and a game that starts
    // silent and stays silent is a bug report. The harness has no hand to
    // click with, so a `?shot` run starts on its own (and stays silent).
    status('');
    const start = async () => {
      // From here to `floptleReady` the panel stays up with the bar moving,
      // and the engine names each step on it as it gets there.
      busy(true);
      status('starting…');
      await painted();
      try {
        play(bytes);
      } catch (e) {
        fail('The game could not start:\n' + ((e && e.stack) || e));
      }
    };
    if (shotAt > 0) {
      start();
      return;
    }
    const btn = $('play');
    btn.classList.add('ready');
    btn.addEventListener('click', () => { btn.classList.remove('ready'); start(); }, { once: true });
  }
</script>
</body>
</html>
