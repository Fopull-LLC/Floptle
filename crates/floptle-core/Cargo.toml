[dependencies]
glam = { workspace = true }

# The browser's clock — see `time::Instant`. Only the wasm target carries it;
# everywhere else the re-export is `std`'s own type.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"
