[package]
name = "floptle-net"
description = "Open, transport-agnostic netcode: replication, RPC, sessions (ADR-0022)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floptle-core = { path = "../floptle-core" }
floptle-scene = { path = "../floptle-scene" }
serde = { workspace = true }
postcard = { workspace = true }
ron = { workspace = true }
bytes = "1"

# The voice codec + mixer, for the end-to-end voice test only (`floptle/0180`).
# A dev-dependency rather than a real one: this crate carries voice FRAMES and
# has no opinion about what is inside them, which is what keeps the codec off
# the wasm build and out of a dedicated server that only forwards.
[dev-dependencies]
floptle-audio = { path = "../floptle-audio" }

# **The QUIC transport, on the platforms that have UDP sockets.** quinn on a
# background tokio runtime, bridged to the sync `Transport` trait; rcgen mints
# the dev self-signed cert.
#
# Target-gated because a browser has no UDP socket to give it, and the failure
# without this gate is not a graceful one: tokio's `net` feature pulls `mio`,
# which stops the wasm build with "This wasm target is unsupported by mio" and
# 47 errors inside a dependency — a wall that says nothing about this engine.
# Everything else here (the protocol, the session, prediction, rollback, the
# in-memory hub) is pure Rust and compiles anywhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The public roots a MANAGED relay's certificate is checked against — see
# `quic::ClientTrust`. A self-hosted relay keeps the dev-trust model.
webpki-roots = "0.26"
rcgen = "0.13"
# Already under rustls; here for the certificate fingerprint an operator
# compares against `openssl x509 -fingerprint` (`quic::fingerprint_of`).
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
# The relay's UDP socket is built by hand so its kernel buffers can be sized
# before quinn takes it (`floptle/0234`). Already under quinn; here for
# `SO_RCVBUF`/`SO_SNDBUF`, which std's `UdpSocket` cannot set.
socket2 = "0.6"
