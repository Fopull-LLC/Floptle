[package]
name = "floptle-script"
description = "Scripting host: Lua (LuaJIT via mlua), hot-reload, the node-script API surface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Types only (PlayParams + enums for the audio command queue); no OS audio stack.
floptle-audio = { path = "../floptle-audio", default-features = false }
floptle-core = { path = "../floptle-core" }
# Types + resolution only; the gilrs device backend belongs to the driver.
floptle-input = { path = "../floptle-input", default-features = false }
floptle-ui = { path = "../floptle-ui" }
floptle-physics = { path = "../floptle-physics" }
floptle-field = { path = "../floptle-field" }
glam = { workspace = true }
mlua = { version = "0.10", features = ["luajit", "vendored"] }
floptle-net = { path = "../floptle-net" }
# `account.*`: the device flow + the Cloud client. The token stays in there —
# a script asks for a player, never a token.
floptle-account = { path = "../floptle-account" }
ron = { workspace = true }
serde = { workspace = true }
# `http.*` / `json.*` (proposal §4): blocking requests on worker threads, never
# on the frame thread. ureq is already what the Hub and the dist pipeline use.
serde_json = { workspace = true }
ureq = { workspace = true }
