[package]
name = "floptle-script"
description = "Scripting host: Lua (LuaJIT via mlua), hot-reload, the node-script API surface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# **Exactly one script VM.** ADR-0028 takes the engine to Luau everywhere: it is
# the only one of the two that reaches a browser at all (LuaJIT's interpreter is
# hand-written assembly per architecture, and wasm is not one of them), and it is
# *faster* than LuaJIT on this engine's real hot path, where scripts spend their
# time crossing the Lua<->host boundary and aborting LuaJIT's traces.
#
# **Luau is the default as of v0.84.0.** The dual-VM diff harness went green on
# the whole suite, every shipped game script and every tutorial project, and the
# real-game bench came back FASTER on both (Solar 4.81 -> 4.15 ms, a
# Forgery-shaped scene 13.99 -> 12.38 ms, frame p95). The `vm-luajit` escape
# hatch stayed buildable for the release after (v0.84.x) and was removed in
# v0.89.0, as ADR-0028 scheduled; `src/vm.rs` turns "no VM" into a build
# failure with a message that names the fix.
default = ["vm-luau"]
vm-luau = ["mlua/luau"]
# Luau's own code generator, on the architectures that have one. Off by default
# because it is a performance lever to be benchmarked, not a correctness one —
# and it does not exist on wasm, so the browser build never sees it.
vm-luau-codegen = ["vm-luau", "mlua/luau-jit"]

[dependencies]
floptle-say = { path = "../floptle-say" }
# Files go through the engine's filesystem: std::fs on the desktop, the game's bundle in a browser.
floptle-vfs = { path = "../floptle-vfs" }
# Types only (PlayParams + enums for the audio command queue); no OS audio stack.
floptle-audio = { path = "../floptle-audio", default-features = false }
floptle-core = { path = "../floptle-core" }
floptle-nav = { path = "../floptle-nav" }
floptle-tiles = { path = "../floptle-tiles" } # tm:solid / tm:tags / tm:autotile read a TileSet
# Types + resolution only; the gilrs device backend belongs to the driver.
floptle-input = { path = "../floptle-input", default-features = false }
floptle-ui = { path = "../floptle-ui" }
floptle-physics = { path = "../floptle-physics" }
floptle-field = { path = "../floptle-field" }
glam = { workspace = true }
# Which Lua the engine runs is a FEATURE, not a fact — see `[features]` below
# and `src/vm.rs`, which fails the build for both or neither.
mlua = { version = "0.10" }
floptle-net = { path = "../floptle-net" }
# `account.*`: the device flow + the Cloud client. The token stays in there —
# a script asks for a player, never a token.
floptle-account = { path = "../floptle-account" }
floptle-services = { path = "../floptle-services" }
ron = { workspace = true }
serde = { workspace = true }
# `json.*` (proposal §4).
serde_json = { workspace = true }
# `openUrl` parses what it is handed before anything opens it.
url = "2"

# **`http.*`, on the platforms that have sockets.** Blocking requests on worker
# threads, never on the frame thread; ureq is already what the Hub and the dist
# pipeline use. A browser has none of that shape available to it — see `dispatch` in
# `src/http_api.rs`, which refuses the call there rather than hanging on it — and
# ureq's TLS stack alone is a large slice of a wasm module nothing could call.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }

# **`openUrl` on Windows** goes through `ShellExecuteW` rather than `cmd /C
# start`: `cmd.exe` reads `&`, `%VAR%` and a closing quote out of the URL as
# its own syntax, and the browser was never the only thing a link could open.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# **`openUrl`, in the browser.** The one place the page itself is the platform's
# browser, so this is a real implementation rather than another refusal — see
# `open_in_browser` in `src/http_api.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }
