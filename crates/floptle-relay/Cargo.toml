[package]
name = "floptle-relay"
description = "The open rendezvous relay: lobby codes, no port-forwarding (ADR-0022)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
floptle-net = { path = "../floptle-net" }
# The control plane, for managed mode only. `ureq` is what the Hub, the dist
# crate and a game's own `account.*` already use; a relay makes at most one
# call every thirty seconds and never on the path a player waits behind.
ureq = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
