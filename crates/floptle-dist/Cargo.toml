[package]
name = "floptle-dist"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared distribution plumbing: the release manifest, and downloading/verifying/unpacking the bundles it lists."

[dependencies]
serde = { workspace = true }
serde_json = "1"
directories = "6"

sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# The manifest fetch and the bundle download — the only two things in this crate
# that reach the network, and the only two a browser build has no use for.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }
