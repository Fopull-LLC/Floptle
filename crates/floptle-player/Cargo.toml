[package]
name = "floptle-player"
version.workspace = true
edition.workspace = true
description = "The standalone game player — what an exported build ships"
publish = false

# The binary an export ships, renamed to the game's own title. It is a shim:
# everything is in `floptle-editor`'s library half, so a build runs the same
# engine the editor runs rather than a second copy of it.
[[bin]]
name = "floptle-player"
path = "src/main.rs"

# The same player with Steam compiled in, for a project with a Steam App ID.
# A separate binary rather than the one above with the feature on: Steam's
# runtime library is linked dynamically, so a binary built with it will not
# start without Valve's library beside it, and a game that is not on Steam
# should not carry one. Built on its own:
#   cargo build --release -p floptle-player --features steam --bin floptle-player-steam
[[bin]]
name = "floptle-player-steam"
path = "src/steam_main.rs"
required-features = ["steam"]

[features]
steam = ["floptle-editor/steam"]

[dependencies]
# `default-features = false` is the whole point of this crate: it turns OFF the
# editor half — egui, the dock, the Inspector, the asset browser, the file
# pickers — so none of it is compiled into a shipped game. It also drops the
# default script VM the same way every other dependent does (ADR-0028), so the
# VM is chosen here and cannot be smuggled in twice.
# `devices` because somebody is sitting at this one: it is a game, so it wants
# the audio device and the gamepads. `floptle-server` is the build that does not.
floptle-editor = { path = "../floptle-editor", default-features = false, features = ["vm-luau", "devices"] }

# The Windows executable icon (`build.rs`); a no-op build script elsewhere.
[build-dependencies]
winresource = "0.1"
