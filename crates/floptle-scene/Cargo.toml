[package]
name = "floptle-scene"
description = "Data-driven scene + project model (RON) over the ECS — what the editor authors and saves."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Files go through the engine's filesystem: std::fs on the desktop, the game's bundle in a browser.
floptle-vfs = { path = "../floptle-vfs" }
floptle-core = { path = "../floptle-core" }
floptle-ui = { path = "../floptle-ui" }
# Types only (map-mesh geometry carried by prefabs/clipboard); pure glam + serde.
floptle-map = { path = "../floptle-map" }
# Types only (AudioSource component + mixer graph); no OS audio stack here.
floptle-audio = { path = "../floptle-audio", default-features = false }

serde = { workspace = true }
ron = { workspace = true }
