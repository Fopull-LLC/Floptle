# Every push and pull request runs the full test suite and the zero-warning
# lint pass, plus the build configurations the workspace build does not cover
# (player, server, browser, aarch64). release.yml runs this same workflow as a
# precondition of publishing.
name: ci

on:
  push:
    branches: ["**"] # branches only — a tag push runs the gate inside release.yml
  pull_request:
  workflow_call: # release.yml calls this, so there is exactly one definition of "green"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit messages are published with the repository and carry no tool
  # attribution. `.githooks/commit-msg` refuses the trailer locally; this is
  # the same check on whatever was pushed.
  trailers:
    name: no co-author trailers
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            range="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          bad=0
          for c in $(git rev-list "$range"); do
            if git show -s --format=%B "$c" | grep -qiE '^co-authored-by:|generated with|🤖'; then
              echo "::error::$c carries an attribution line"; bad=1
            fi
          done
          exit $bad

  gate:
    name: test + clippy
    runs-on: ubuntu-latest
    # A runaway guard, not a budget: a tag run builds cold (the cache is keyed
    # to the branch) and a slow runner has hit 45 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Windowing/GPU headers for wgpu + winit, ALSA for audio, udev for gamepads.
      - name: Linux build deps
        run: |
          # The runner image carries third-party apt repos that occasionally
          # fail their index fetch; the install below is the real check.
          sudo apt-get update || true
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

      # The configuration an exported game ships: the engine without `editor-ui`.
      # The workspace build always has the feature on, so this is the only
      # place a stray dependency on the editor half shows up before a release.
      - name: player build (no editor-ui)
        run: |
          cargo clippy -p floptle-editor -p floptle-player \
            --no-default-features --features floptle-editor/vm-luau,floptle-editor/devices \
            --all-targets -- -D warnings

      # The configuration a dedicated server ships: the player's minus audio and
      # gamepad devices. `cpal` and `gilrs` link libasound/libudev at link time,
      # which a minimal server image does not have, so `ldd` is the real check.
      - name: server build (no devices)
        run: |
          cargo clippy -p floptle-editor -p floptle-server \
            --no-default-features --features floptle-editor/vm-luau \
            --all-targets -- -D warnings
          cargo build -p floptle-server
          if ldd target/debug/floptle-server | grep -qE 'libasound|libudev'; then
            echo "::error::floptle-server links an audio or input device library."
            echo "It will not start on a minimal server image. Check the 'devices' feature."
            ldd target/debug/floptle-server | grep -E 'libasound|libudev'
            exit 1
          fi
          echo "floptle-server needs only:"
          ldd target/debug/floptle-server

      # The browser target. `std::fs`, `Instant::now()` and `thread::spawn` all
      # compile for wasm and fail at runtime, so `tools/web/clippy.toml` makes
      # each a lint error on this target. The WASI SDK compiles Luau's C++.
      - name: wasm32 lint (engine library only)
        run: |
          rustup target add wasm32-unknown-unknown
          . tools/web/env.sh
          CLIPPY_CONF_DIR=tools/web cargo clippy -p floptle-editor --no-default-features \
            --features vm-luau --target wasm32-unknown-unknown \
            -- -D warnings -D clippy::disallowed-methods -D clippy::disallowed-types

      # `--all-targets` skips doc-tests.
      - name: doc tests
        run: cargo test --workspace --doc

      # The self-asserting render probes (`--all-targets` compiles examples but
      # runs none). Only probes whose assertion is backend-independent belong
      # here — a comparison of two renders from the same device, or a flat
      # colour — so a software rasteriser answers them the same way a card does.
      - name: software Vulkan (lavapipe)
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      # Each probe takes its output argument in its own form (directory, file,
      # or prefix), so they are listed rather than looped.
      - name: render probes
        env:
          WGPU_BACKEND: vulkan
        run: |
          P="$RUNNER_TEMP/probes"; mkdir -p "$P"
          run() { echo "::group::$1"; shift; cargo run -q -p floptle-render --example "$@" || exit 1; echo "::endgroup::"; }
          run skin_prepass_probe  skin_prepass_probe  -- "$P/skin_prepass"
          run skin_probe          skin_probe          -- "$P/skin.png"
          run ortho_camera_probe  ortho_camera_probe  -- "$P"
          run tilemap_pages_probe tilemap_pages_probe -- "$P"
          run light2d_probe       light2d_probe       -- "$P"
          run light2d_shadow_probe light2d_shadow_probe -- "$P"
          run posterize_chroma_probe posterize_chroma_probe -- "$P"
          run light2d_smooth_probe light2d_smooth_probe -- "$P"
          run sky_sweep_probe     sky_sweep_probe     -- "$P"
          run ui_text_snap_probe  ui_text_snap_probe  -- "$P"
          run look_probe          look_probe          -- "$P"
          run pbr_probe           pbr_probe           -- "$P"
          run particles_bind_probe particles_bind_probe
          run hdr_probe           hdr_probe           -- "$P"
          run post_shader_probe   post_shader_probe   -- "$P"
          run dof_probe           dof_probe           -- "$P"
          run gi_probe            gi_probe            -- "$P"
          run fog_probe           fog_probe           -- "$P"
          run area_light_probe    area_light_probe    -- "$P"
          run spot_light_probe    spot_light_probe    -- "$P"
          run contact_shadow_probe contact_shadow_probe -- "$P"
          run mesh_only_shadow_probe mesh_only_shadow_probe -- "$P"
          run motion_probe        motion_probe        -- "$P"
          run retro_fog_probe     retro_fog_probe     -- "$P"
          run ui_world_probe      ui_world_probe
          run surface_gap_probe   surface_gap_probe   -- "$P"
          run reflection_probe    reflection_probe    -- "$P"
          run ssr_probe           ssr_probe           -- "$P"
          run point_shadow_probe  point_shadow_probe  -- "$P"
          run refraction_probe    refraction_probe    -- "$P"
          run interior_reflection_probe interior_reflection_probe -- "$P"
          run offscreen_shadow_probe    offscreen_shadow_probe    -- "$P"
          run glass_layers_probe        glass_layers_probe        -- "$P"
          run fog_noise_probe           fog_noise_probe           -- "$P"

      # The PNGs are the evidence when a probe fails.
      - name: keep the probe images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-images
          path: ${{ runner.temp }}/probes
          if-no-files-found: warn

  steam-gate:
    # `gate` never turns the `steam` feature on. `steamworks-sys` builds with
    # no Steamworks SDK present; this covers the binding surface, not a live
    # Steam client.
    name: steam feature (services + steam crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy (zero warnings, steam feature on)
        run: cargo clippy -p floptle-services -p floptle-steam --features floptle-steam/steam --all-targets -- -D warnings

      - name: test (steam feature on)
        run: cargo test -p floptle-services -p floptle-steam --features floptle-steam/steam

  fleet:
    # The fleet agent and server ship as bare aarch64 binaries from release.yml
    # (the region boxes are ARM); nothing else builds for that target, so it is
    # checked on every push rather than discovered at a tag.
    name: aarch64 (fleet agent + server)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The same headers as `gate`: the server is a shim over the editor library.
      - name: Linux build deps
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy (zero warnings, aarch64)
        run: cargo clippy -p floptle-fleet -p floptle-server --all-targets -- -D warnings

      - name: the agent runs, and says so
        run: |
          set -euo pipefail
          cargo build --release -p floptle-fleet
          file target/release/floptle-fleet
          ./target/release/floptle-fleet --help > fleet-help.txt
          head -3 fleet-help.txt
          # It must refuse to start with no token rather than poll forever.
          if ./target/release/floptle-fleet --region us-east --once; then
            echo "::error::the agent started with no box token"
            exit 1
          fi

  web:
    # The browser build compiles and links on every push (there is no WebGPU on
    # a runner to run it). The link is what fails when the C++ side drifts;
    # see docs/web-export.md. wasm-bindgen is deliberately not installed.
    name: browser build (compile + link)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: build for wasm32-unknown-unknown
        run: |
          . tools/web/env.sh
          cargo build -p floptle-web --profile web --target wasm32-unknown-unknown
      - name: the module imports nothing from WASI
        run: |
          python3 tools/web/imports.py "$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')/wasm32-unknown-unknown/web/floptle_web.wasm"
