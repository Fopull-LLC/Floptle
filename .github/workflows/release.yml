# Release pipeline (ADR-0021, docs/updating-the-hub.md). On a semver tag `v*`:
# build a self-contained editor bundle per platform, checksum it, and publish
# the archives plus a machine-readable `releases.json` manifest to GitHub
# Releases. The Floptle Hub reads that manifest to list and install versions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing publishes until ci.yml is green on the tagged commit.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,  rust: x86_64-unknown-linux-gnu }
          - { os: macos-14,       target: macos-aarch64, rust: aarch64-apple-darwin }
          # Intel macOS cross-compiles on the ARM runner; Intel runners are retired.
          - { os: macos-14,       target: macos-x86_64,  rust: x86_64-apple-darwin }
          - { os: windows-latest, target: windows-x86_64, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux needs windowing/GPU headers (wgpu + winit), ALSA (audio) and udev
      # (gamepads); macOS and Windows use OS APIs for all three.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          # Third-party apt repos on the image occasionally fail their index
          # fetch; the install below is the real check.
          sudo apt-get update || true
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The editor (what the Hub runs), the player (what Export Game ships,
      # with no authoring half), and the Hub itself.
      - name: Build editor + player + hub
        run: |
          cargo build --release -p floptle-editor --target ${{ matrix.rust }}
          cargo build --release -p floptle-player --target ${{ matrix.rust }}
          cargo build --release -p floptle-hub --target ${{ matrix.rust }}

      # The managed relay, x86_64 Linux only, shipped as a bare binary beside
      # its checksum: the install is a few lines on a minimal image.
      - name: Build the managed relay (linux-x86_64)
        if: matrix.target == 'linux-x86_64'
        run: cargo build --release -p floptle-relay --target ${{ matrix.rust }}

      # The load generator that sizes a relay, for both Linux architectures:
      # it is run from a region box, not a laptop.
      - name: Build the relay bench (linux-x86_64)
        if: matrix.target == 'linux-x86_64'
        run: cargo build --release -p floptle-relay-bench --target ${{ matrix.rust }}

      # The verb table as a release artifact. `cli.rs` generates the parser,
      # `--help` and `help --json`; the website renders its CLI page from this
      # file so it cannot describe a verb the engine does not have.
      - name: Describe the command line (linux-x86_64)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          ./target/${{ matrix.rust }}/release/floptle help --json > cli.json
          # The site renders these four fields per verb.
          jq -e '.version and (.verbs | length > 0)' cli.json >/dev/null
          jq -e '[.verbs[] | has("name") and has("summary") and has("needsGpu") and has("writesProject")] | all' cli.json >/dev/null
          echo "cli.json: $(jq '.verbs | length' cli.json) verbs for $(jq -r .version cli.json)"

      - name: Package the relay
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          R="floptle-relay-$VER-linux-x86_64"
          cp "target/${{ matrix.rust }}/release/floptle-relay" "$R"
          chmod +x "$R"
          sha256sum "$R" > "$R.sha256"
          echo "relay sha256: $(cut -d' ' -f1 < "$R.sha256")"
          # Proof it runs on a box with nothing installed.
          ldd "$R" || true
          # To a file, not through `head`: under `pipefail` a `head` that
          # closes the pipe early fails the writer.
          ./"$R" --help > relay-help.txt
          head -3 relay-help.txt

          B="floptle-relay-bench-$VER-linux-x86_64"
          cp "target/${{ matrix.rust }}/release/floptle-relay-bench" "$B"
          chmod +x "$B"
          sha256sum "$B" > "$B.sha256"
          # To a file for the same reason.
          ./"$B" --help > bench-help.txt
          head -3 bench-help.txt

      # A flat archive (contents at the root, as floptle_hub::install::unpack
      # expects). The Hub ships as its own small archive beside it.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"; T="${{ matrix.target }}"
          B="floptle-$VER-$T"
          mkdir -p "$B"
          cp "target/${{ matrix.rust }}/release/floptle" "$B/floptle"
          # An export for this platform copies this binary out of the bundle.
          cp "target/${{ matrix.rust }}/release/floptle-player" "$B/floptle-player"
          printf '{ "version": "%s", "target": "%s", "commit": "%s" }\n' "$VER" "$T" "${GITHUB_SHA:0:7}" > "$B/version.json"
          tar -C "$B" -czf "$B.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then SHA=$(sha256sum "$B.tar.gz" | cut -d' ' -f1)
          else SHA=$(shasum -a 256 "$B.tar.gz" | cut -d' ' -f1); fi
          SIZE=$(wc -c < "$B.tar.gz" | tr -d ' ')
          printf '{"target":"%s","file":"%s.tar.gz","sha256":"%s","size":%s}\n' "$T" "$B" "$SHA" "$SIZE" > "fragment-$T.json"
          H="floptle-hub-$VER-$T"
          mkdir -p "$H"
          cp "target/${{ matrix.rust }}/release/floptle-hub" "$H/floptle-hub"
          tar -C "$H" -czf "$H.tar.gz" .
          # The Hub needs a URL and checksum for its own bundle to update itself.
          if command -v sha256sum >/dev/null 2>&1; then HSHA=$(sha256sum "$H.tar.gz" | cut -d' ' -f1)
          else HSHA=$(shasum -a 256 "$H.tar.gz" | cut -d' ' -f1); fi
          HSIZE=$(wc -c < "$H.tar.gz" | tr -d ' ')
          printf '{"target":"%s","file":"%s.tar.gz","sha256":"%s","size":%s}\n' "$T" "$H" "$HSHA" "$HSIZE" > "hub-fragment-$T.json"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"; $t = "${{ matrix.target }}"
          $b = "floptle-$ver-$t"
          New-Item -ItemType Directory -Force -Path $b | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/floptle.exe" "$b/floptle.exe"
          Copy-Item "target/${{ matrix.rust }}/release/floptle-player.exe" "$b/floptle-player.exe"
          $commit = $env:GITHUB_SHA.Substring(0,7)
          "{ ""version"": ""$ver"", ""target"": ""$t"", ""commit"": ""$commit"" }" | Set-Content -NoNewline "$b/version.json"
          Compress-Archive -Path "$b/*" -DestinationPath "$b.zip" -Force
          $sha  = (Get-FileHash "$b.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "$b.zip").Length
          "{""target"":""$t"",""file"":""$b.zip"",""sha256"":""$sha"",""size"":$size}" | Set-Content -NoNewline "fragment-$t.json"
          $h = "floptle-hub-$ver-$t"
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/floptle-hub.exe" "$h/floptle-hub.exe"
          Compress-Archive -Path "$h/*" -DestinationPath "$h.zip" -Force
          # See the unix step: the Hub's own bundle needs a checksum in the manifest.
          $hsha  = (Get-FileHash "$h.zip" -Algorithm SHA256).Hash.ToLower()
          $hsize = (Get-Item "$h.zip").Length
          "{""target"":""$t"",""file"":""$h.zip"",""sha256"":""$hsha"",""size"":$hsize}" | Set-Content -NoNewline "hub-fragment-$t.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            floptle-*.tar.gz
            floptle-*.zip
            floptle-hub-*.tar.gz
            floptle-hub-*.zip
            fragment-*.json
            hub-fragment-*.json
            floptle-relay-*
            cli.json
          if-no-files-found: error

  # The dedicated-server binaries for the ARM region boxes, published as bare
  # binaries rather than as a platform (linux-aarch64 is deliberately not in
  # the Hub's install list or the export dialog):
  #
  #   floptle-server  the engine a fleet box runs a project bundle with; the
  #                   version pinned in a bundle's manifest is the one the
  #                   agent downloads, so every release publishes one.
  #   floptle-fleet   the agent: polls /desired, runs one server per
  #                   deployment, reports to /status.
  fleet:
    name: bundle linux-aarch64 (server + fleet agent)
    needs: gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # `floptle-server` is a shim over the editor library, so it needs the
      # same build headers as the x86_64 bundle even though it links none of
      # them at run time.
      - name: Linux build deps
        run: |
          # Third-party apt repos on the image occasionally fail their index
          # fetch; the install below is the real check.
          sudo apt-get update || true
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release -p floptle-server -p floptle-fleet -p floptle-relay-bench

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          for BIN in floptle-server floptle-fleet floptle-relay-bench; do
            OUT="$BIN-$VER-linux-aarch64"
            cp "target/release/$BIN" "$OUT"
            chmod +x "$OUT"
            sha256sum "$OUT" > "$OUT.sha256"
            echo "$BIN sha256: $(cut -d' ' -f1 < "$OUT.sha256")"
            # The agent verifies the published checksum before it runs an
            # engine, so a missing .sha256 is a deployment that cannot start.
            ldd "$OUT" || true
          done
          # `--help` exits 0 and prints a table; written to a file because
          # `head` closing the pipe early fails the writer under `pipefail`.
          ./"floptle-fleet-$VER-linux-aarch64" --help > fleet-help.txt
          head -3 fleet-help.txt
          # The bench runs from a region box; a laptop measures a home upstream.
          ./"floptle-relay-bench-$VER-linux-aarch64" --help > bench-help.txt
          head -3 bench-help.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux-aarch64
          path: |
            floptle-server-*-linux-aarch64
            floptle-server-*-linux-aarch64.sha256
            floptle-fleet-*-linux-aarch64
            floptle-fleet-*-linux-aarch64.sha256
            floptle-relay-bench-*-linux-aarch64
            floptle-relay-bench-*-linux-aarch64.sha256
          if-no-files-found: error

  # The browser template: the wasm module, its JS glue and the player page —
  # what File ⏵ Export Game… → Web (browser) downloads for this version, under
  # the `web` artifact key beside the platform bundles. Built the way
  # tools/web/build.sh builds it locally (the WASI SDK compiles Luau's C++;
  # wasm-bindgen at the version Cargo.lock pins writes the glue).
  web:
    needs: gate
    name: bundle web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen-cli at the lockfile's version
        shell: bash
        run: |
          set -euo pipefail
          WANT=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$WANT" --locked
      - name: Build the web template
        shell: bash
        run: |
          set -euo pipefail
          . tools/web/env.sh
          tools/web/build.sh
      - name: Package + checksum
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"; T=web
          OUT=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')/web
          B="floptle-$VER-$T"; rm -rf "$B"; mkdir -p "$B"
          cp "$OUT/index.html" "$OUT/probe.html" "$B/"
          cp -r "$OUT/pkg" "$B/pkg"
          printf '{ "version": "%s", "target": "%s", "commit": "%s" }\n' "$VER" "$T" "${GITHUB_SHA:0:7}" > "$B/version.json"
          tar -C "$B" -czf "$B.tar.gz" .
          SHA=$(sha256sum "$B.tar.gz" | cut -d' ' -f1)
          SIZE=$(wc -c < "$B.tar.gz" | tr -d ' ')
          printf '{"target":"%s","file":"%s.tar.gz","sha256":"%s","size":%s}\n' "$T" "$B" "$SHA" "$SIZE" > "fragment-$T.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-web
          path: |
            floptle-*.tar.gz
            fragment-*.json
          if-no-files-found: error

  release:
    name: publish
    needs: [build, web, fleet]
    runs-on: ubuntu-latest
    # Bundles are published to Fopull-LLC/Floptle-releases, where the Hub's
    # default manifest URL points. That needs the RELEASES_TOKEN secret; without
    # it this job still archives everything on this repo and
    # scripts/publish-public.sh <tag> finishes the publish by hand.
    env:
      PUBLIC_REPO: Fopull-LLC/Floptle-releases
    steps:
      # For docs/releases/<tag>.md — the release notes, which are both the body of
      # the GitHub release and (embedded below) what the Hub shows for a version.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Merge this version into the manifest (fetch the existing one so past versions
      # survive), pointing each artifact at its PUBLIC release download URL.
      - name: Assemble releases.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN != '' && secrets.RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"
          ARTIFACTS="{}"; HUB_ARTIFACTS="{}"
          # `fragment-*` is the engine bundle and `hub-fragment-*` the Hub's own; the two
          # globs are disjoint because the second name doesn't start with `fragment-`.
          # Which map an entry lands in is decided by the basename below, not by the glob.
          for f in artifacts/*/fragment-*.json artifacts/*/hub-fragment-*.json; do
            [ -f "$f" ] || continue
            T=$(jq -r .target "$f"); FILE=$(jq -r .file "$f"); SHA=$(jq -r .sha256 "$f"); SIZE=$(jq -r .size "$f")
            URL="https://github.com/$PUBLIC_REPO/releases/download/$TAG/$FILE"
            ENTRY=$(jq -n --arg t "$T" --arg u "$URL" --arg s "$SHA" --argjson z "$SIZE" '{($t): {url:$u, sha256:$s, size:$z}}')
            case "$(basename "$f")" in
              hub-fragment-*) HUB_ARTIFACTS=$(jq -n --argjson a "$HUB_ARTIFACTS" --argjson e "$ENTRY" '$a + $e');;
              *)              ARTIFACTS=$(jq -n --argjson a "$ARTIFACTS" --argjson e "$ENTRY" '$a + $e');;
            esac
          done
          # A prerelease tag (v0.4.0-rc1) goes on the 'beta' channel, else 'stable'.
          CHAN=stable; case "$VER" in *-*) CHAN=beta;; esac
          ENTRY=$(jq -n --arg v "$VER" --arg c "$CHAN" --arg d "$(date +%F)" --arg n "https://github.com/$PUBLIC_REPO/releases/tag/$TAG" --argjson a "$ARTIFACTS" --argjson h "$HUB_ARTIFACTS" \
            '{version:$v, channel:$c, date:$d, notes_url:$n, artifacts:$a, hub_artifacts:$h}')
          # Start from the PUBLIC manifest if one is published, else empty.
          #
          # Read from a file, not argv: Linux caps a single argv entry at 128 KB
          # and the manifest is larger than that.
          mkdir -p prev
          if ! gh release download manifest --repo "$PUBLIC_REPO" --pattern releases.json --dir prev 2>/dev/null; then
            echo '{"schema":1,"channels":{},"versions":[]}' > prev/releases.json
          fi
          jq -n --slurpfile m prev/releases.json --argjson e "$ENTRY" --arg v "$VER" --arg c "$CHAN" '
            ($m[0]) as $prev |
            {
              schema: 1,
              channels: (($prev.channels // {}) | .[$c] = ((((.[$c] // []) + [$v]) | unique))),
              versions: (((($prev.versions // []) | map(select(.version != $v))) + [$e]))
            }' > releases.json
          # A merge that dropped the history would leave every Hub showing one version.
          test "$(jq '.versions | length' releases.json)" -ge "$(jq '.versions | length' prev/releases.json)" \
            || { echo "::error::the merge lost versions"; exit 1; }
          # Fill every entry's notes from docs/releases/ — this version's, and any older
          # one published before the manifest carried notes at all. See the script header.
          # …and docs/news.md as the top-level `news`, which the Hub's News tab shows.
          scripts/embed-release-notes.sh releases.json docs/releases docs/news.md
          jq '{schema, channels, news: (.news | length), versions: [.versions[] | {version, title, notes: (.notes | length), changed: (.changed // "both"), engine: (.artifacts | keys), hub: (.hub_artifacts // {} | keys)}]}' releases.json

      # `cli.json`, the verb table the Linux build wrote, at the same stable URL.
      - name: The verb table is here
        shell: bash
        run: test -s artifacts/bundle-linux-x86_64/cli.json

      # The docs feed fopull.com renders. It rides the release rather than the
      # branch so a guide never describes a feature the download lacks.
      - name: Build the docs feed
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-docs-feed.sh docs.json docs "${GITHUB_REF_NAME#v}"

      # The release notes are docs/releases/<tag>.md, shown on the release page
      # and inside the Hub.
      - name: Resolve the release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [ -f "docs/releases/$TAG.md" ]; then
            cp "docs/releases/$TAG.md" NOTES.md
          else
            echo "::warning::docs/releases/$TAG.md is missing — the release page will carry a stub."
            printf 'Floptle %s\n\nDownload the floptle-hub archive for your platform; the Hub installs engine versions.\n' "$TAG" > NOTES.md
          fi

      # Archive of record on this repo; scripts/publish-public.sh mirrors it
      # when RELEASES_TOKEN is not set.
      - name: Archive on this repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; REPO="${{ github.repository }}"
          shopt -s nullglob
          # The relay ships as a bare binary + checksum, outside the bundle globs.
          BUNDLES=(artifacts/*/floptle-*.tar.gz artifacts/*/floptle-*.zip \
                   artifacts/*/floptle-relay-*-linux-x86_64 \
                   artifacts/*/floptle-relay-*-linux-x86_64.sha256 \
                   artifacts/*/floptle-server-*-linux-aarch64 \
                   artifacts/*/floptle-server-*-linux-aarch64.sha256 \
                   artifacts/*/floptle-fleet-*-linux-aarch64 \
                   artifacts/*/floptle-fleet-*-linux-aarch64.sha256 \
                   artifacts/*/floptle-relay-bench-*-linux-aarch64 \
                   artifacts/*/floptle-relay-bench-*-linux-aarch64.sha256)
          # A preview tag is created as a prerelease: GitHub makes any other new
          # release the repo's Latest, and /releases/latest would serve a beta.
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file NOTES.md "${PRE[@]}" || true
          gh release upload "$TAG" "${BUNDLES[@]}" releases.json docs.json artifacts/bundle-linux-x86_64/cli.json --clobber --repo "$REPO"

      - name: Publish to the public releases repo
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASES_TOKEN:-}" ]; then
            echo "::warning::RELEASES_TOKEN not set — public publish skipped. Run scripts/publish-public.sh $GITHUB_REF_NAME locally to finish the release."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN"
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          # The relay ships as a bare binary + checksum, outside the bundle globs.
          BUNDLES=(artifacts/*/floptle-*.tar.gz artifacts/*/floptle-*.zip \
                   artifacts/*/floptle-relay-*-linux-x86_64 \
                   artifacts/*/floptle-relay-*-linux-x86_64.sha256 \
                   artifacts/*/floptle-server-*-linux-aarch64 \
                   artifacts/*/floptle-server-*-linux-aarch64.sha256 \
                   artifacts/*/floptle-fleet-*-linux-aarch64 \
                   artifacts/*/floptle-fleet-*-linux-aarch64.sha256 \
                   artifacts/*/floptle-relay-bench-*-linux-aarch64 \
                   artifacts/*/floptle-relay-bench-*-linux-aarch64.sha256)
          # A preview tag is created as a prerelease: GitHub makes any other new
          # release the repo's Latest, and /releases/latest would serve a beta.
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          gh release create "$TAG" --repo "$PUBLIC_REPO" --title "$TAG" --notes-file NOTES.md "${PRE[@]}" || true
          gh release upload "$TAG" "${BUNDLES[@]}" releases.json docs.json artifacts/bundle-linux-x86_64/cli.json --clobber --repo "$PUBLIC_REPO"
          # A fixed 'manifest' release so the Hub's default URL always resolves to
          # the newest list. It is a prerelease and the version release is marked
          # latest explicitly, or /releases/latest would land on the manifest holder.
          gh release create manifest --repo "$PUBLIC_REPO" --title "Release manifest" --prerelease --notes "Machine-readable version manifest for the Floptle Hub — not a download page. Get Floptle from the LATEST release instead." || true
          gh release upload manifest releases.json docs.json artifacts/bundle-linux-x86_64/cli.json --clobber --repo "$PUBLIC_REPO"
          gh release edit manifest --repo "$PUBLIC_REPO" --prerelease
          case "$TAG" in *-*) ;; *) gh release edit "$TAG" --repo "$PUBLIC_REPO" --latest;; esac
