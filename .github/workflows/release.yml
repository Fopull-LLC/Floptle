# Release pipeline (ADR-0021 / docs/hub-proposal.md §3). On a semver tag `v*`, build a
# self-contained editor bundle per OS, checksum it, publish the archives + a machine-
# readable `releases.json` manifest to GitHub Releases. The Floptle Hub reads that manifest
# to list + install versions.
#
# NOTE: this workflow can only be validated by an actual tag push (CI is not runnable in
# the dev sandbox). The bundle layout + manifest schema mirror the locally-tested
# scripts/package.sh and the Hub's install/unpack code, so the shapes are known-good; the
# GitHub-specific glue (uploads, URL construction) is what a first `v*` push exercises.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing publishes until the suite and the lint pass are green ON THE TAGGED
  # COMMIT. A local run before tagging is not evidence — it can be stale, it can
  # be a dirty tree, and on a full disk `cargo test` prints nothing at all and
  # reads as a pass. This is the only check that is actually about the artifact
  # being shipped. Same definition of green as every other push (ci.yml).
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,  rust: x86_64-unknown-linux-gnu }
          - { os: macos-14,       target: macos-aarch64, rust: aarch64-apple-darwin }
          # Intel macOS CROSS-COMPILES on the ARM runner (Apple toolchains are
          # multi-arch) — macos-13 Intel runners are retired and queue forever.
          - { os: macos-14,       target: macos-x86_64,  rust: x86_64-apple-darwin }
          - { os: windows-latest, target: windows-x86_64, rust: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux needs the windowing/GPU dev headers to build the editor (wgpu + winit),
      # ALSA for the audio backend (cpal → alsa-sys) and udev for the gamepad backend
      # (gilrs → libudev-sys, whose build script does an unconditional
      # `pkg_config::find_library("libudev").unwrap()` and PANICS without the .pc file).
      # macOS/Windows use OS APIs for all three and need nothing extra.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build editor + hub
        run: |
          cargo build --release -p floptle-editor --target ${{ matrix.rust }}
          cargo build --release -p floptle-hub --target ${{ matrix.rust }}

      # A flat archive: the bundle's CONTENTS (editor binary + version.json) sit at the
      # archive root, matching floptle_hub::install::unpack. The HUB ships as its own
      # small archive beside it — the thing a new user downloads first (the Hub then
      # installs engine versions itself).
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"; T="${{ matrix.target }}"
          B="floptle-$VER-$T"
          mkdir -p "$B"
          cp "target/${{ matrix.rust }}/release/floptle" "$B/floptle"
          printf '{ "version": "%s", "target": "%s", "commit": "%s" }\n' "$VER" "$T" "${GITHUB_SHA:0:7}" > "$B/version.json"
          tar -C "$B" -czf "$B.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then SHA=$(sha256sum "$B.tar.gz" | cut -d' ' -f1)
          else SHA=$(shasum -a 256 "$B.tar.gz" | cut -d' ' -f1); fi
          SIZE=$(wc -c < "$B.tar.gz" | tr -d ' ')
          printf '{"target":"%s","file":"%s.tar.gz","sha256":"%s","size":%s}\n' "$T" "$B" "$SHA" "$SIZE" > "fragment-$T.json"
          H="floptle-hub-$VER-$T"
          mkdir -p "$H"
          cp "target/${{ matrix.rust }}/release/floptle-hub" "$H/floptle-hub"
          tar -C "$H" -czf "$H.tar.gz" .
          # The Hub needs a URL and a checksum for ITS OWN bundle to update itself.
          # Without this fragment the archive exists on the release page and no program
          # can find it, which is how the Hub went four months with no way to update.
          if command -v sha256sum >/dev/null 2>&1; then HSHA=$(sha256sum "$H.tar.gz" | cut -d' ' -f1)
          else HSHA=$(shasum -a 256 "$H.tar.gz" | cut -d' ' -f1); fi
          HSIZE=$(wc -c < "$H.tar.gz" | tr -d ' ')
          printf '{"target":"%s","file":"%s.tar.gz","sha256":"%s","size":%s}\n' "$T" "$H" "$HSHA" "$HSIZE" > "hub-fragment-$T.json"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"; $t = "${{ matrix.target }}"
          $b = "floptle-$ver-$t"
          New-Item -ItemType Directory -Force -Path $b | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/floptle.exe" "$b/floptle.exe"
          $commit = $env:GITHUB_SHA.Substring(0,7)
          "{ ""version"": ""$ver"", ""target"": ""$t"", ""commit"": ""$commit"" }" | Set-Content -NoNewline "$b/version.json"
          Compress-Archive -Path "$b/*" -DestinationPath "$b.zip" -Force
          $sha  = (Get-FileHash "$b.zip" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "$b.zip").Length
          "{""target"":""$t"",""file"":""$b.zip"",""sha256"":""$sha"",""size"":$size}" | Set-Content -NoNewline "fragment-$t.json"
          $h = "floptle-hub-$ver-$t"
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          Copy-Item "target/${{ matrix.rust }}/release/floptle-hub.exe" "$h/floptle-hub.exe"
          Compress-Archive -Path "$h/*" -DestinationPath "$h.zip" -Force
          # See the unix step: the Hub's own bundle needs a checksum in the manifest.
          $hsha  = (Get-FileHash "$h.zip" -Algorithm SHA256).Hash.ToLower()
          $hsize = (Get-Item "$h.zip").Length
          "{""target"":""$t"",""file"":""$h.zip"",""sha256"":""$hsha"",""size"":$hsize}" | Set-Content -NoNewline "hub-fragment-$t.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            floptle-*.tar.gz
            floptle-*.zip
            floptle-hub-*.tar.gz
            floptle-hub-*.zip
            fragment-*.json
            hub-fragment-*.json
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # Distribution is PUBLIC (Fopull-LLC/Floptle-releases): the Hub's default
    # manifest URL points there and anyone can download — the engine source
    # stays in this private repo. Publishing there needs the RELEASES_TOKEN
    # secret (a PAT with write access to the releases repo); without it, this
    # job still archives everything on THIS repo and someone with local gh
    # auth finishes with scripts/publish-public.sh <tag>.
    env:
      PUBLIC_REPO: Fopull-LLC/Floptle-releases
    steps:
      # For docs/releases/<tag>.md — the release notes, which are both the body of
      # the GitHub release and (embedded below) what the Hub shows for a version.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Merge this version into the manifest (fetch the existing one so past versions
      # survive), pointing each artifact at its PUBLIC release download URL.
      - name: Assemble releases.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN != '' && secrets.RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"
          ARTIFACTS="{}"; HUB_ARTIFACTS="{}"
          # `fragment-*` is the engine bundle and `hub-fragment-*` the Hub's own; the two
          # globs are disjoint because the second name doesn't start with `fragment-`.
          # Which map an entry lands in is decided by the basename below, not by the glob.
          for f in artifacts/*/fragment-*.json artifacts/*/hub-fragment-*.json; do
            [ -f "$f" ] || continue
            T=$(jq -r .target "$f"); FILE=$(jq -r .file "$f"); SHA=$(jq -r .sha256 "$f"); SIZE=$(jq -r .size "$f")
            URL="https://github.com/$PUBLIC_REPO/releases/download/$TAG/$FILE"
            ENTRY=$(jq -n --arg t "$T" --arg u "$URL" --arg s "$SHA" --argjson z "$SIZE" '{($t): {url:$u, sha256:$s, size:$z}}')
            case "$(basename "$f")" in
              hub-fragment-*) HUB_ARTIFACTS=$(jq -n --argjson a "$HUB_ARTIFACTS" --argjson e "$ENTRY" '$a + $e');;
              *)              ARTIFACTS=$(jq -n --argjson a "$ARTIFACTS" --argjson e "$ENTRY" '$a + $e');;
            esac
          done
          # A prerelease tag (v0.4.0-rc1) goes on the 'beta' channel, else 'stable'.
          CHAN=stable; case "$VER" in *-*) CHAN=beta;; esac
          ENTRY=$(jq -n --arg v "$VER" --arg c "$CHAN" --arg d "$(date +%F)" --arg n "https://github.com/$PUBLIC_REPO/releases/tag/$TAG" --argjson a "$ARTIFACTS" --argjson h "$HUB_ARTIFACTS" \
            '{version:$v, channel:$c, date:$d, notes_url:$n, artifacts:$a, hub_artifacts:$h}')
          # Start from the PUBLIC manifest if one is published, else empty.
          #
          # READ FROM A FILE, NOT FROM ARGV. This was `--argjson m "$EXISTING"` with the
          # whole manifest in a shell variable, and it worked right up until the manifest
          # grew release notes: Linux caps a SINGLE argv entry at 128 KB (MAX_ARG_STRLEN)
          # no matter how large ARG_MAX is, and the manifest passed 240 KB. The failure is
          # `jq: Argument list too long` from the kernel, before jq runs — so it says
          # nothing about which argument, and it only appears on the release AFTER the one
          # that grew the file. `--slurpfile` reads it directly and has no size limit.
          mkdir -p prev
          if ! gh release download manifest --repo "$PUBLIC_REPO" --pattern releases.json --dir prev 2>/dev/null; then
            echo '{"schema":1,"channels":{},"versions":[]}' > prev/releases.json
          fi
          jq -n --slurpfile m prev/releases.json --argjson e "$ENTRY" --arg v "$VER" --arg c "$CHAN" '
            ($m[0]) as $prev |
            {
              schema: 1,
              channels: (($prev.channels // {}) | .[$c] = ((((.[$c] // []) + [$v]) | unique))),
              versions: (((($prev.versions // []) | map(select(.version != $v))) + [$e]))
            }' > releases.json
          # A merge that silently dropped the history would publish a manifest listing one
          # version, and every Hub in the world would show one version. Cheap to assert.
          test "$(jq '.versions | length' releases.json)" -ge "$(jq '.versions | length' prev/releases.json)" \
            || { echo "::error::the merge lost versions"; exit 1; }
          # Fill every entry's notes from docs/releases/ — this version's, and any older
          # one published before the manifest carried notes at all. See the script header.
          # …and docs/news.md as the top-level `news`, which the Hub's News tab shows.
          scripts/embed-release-notes.sh releases.json docs/releases docs/news.md
          jq '{schema, channels, news: (.news | length), versions: [.versions[] | {version, title, notes: (.notes | length), changed: (.changed // "both"), engine: (.artifacts | keys), hub: (.hub_artifacts // {} | keys)}]}' releases.json

      # The docs feed fopull.com renders (contracts/engine-site-feed.md). It rides
      # the release rather than the website reading `main`, for the same reason the
      # notes do: docs describe a BUILD. Scraping the branch would put a guide to
      # an unreleased feature next to a download button for the version without it.
      - name: Build the docs feed
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-docs-feed.sh docs.json docs "${GITHUB_REF_NAME#v}"

      # The release notes ARE docs/releases/<tag>.md. One file, written once, shown on the
      # GitHub release page and inside the Hub — rather than a page nobody reads saying
      # "Automated release v0.21.0" beside a document that says what actually changed.
      - name: Resolve the release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [ -f "docs/releases/$TAG.md" ]; then
            cp "docs/releases/$TAG.md" NOTES.md
          else
            echo "::warning::docs/releases/$TAG.md is missing — the release page will carry a stub."
            printf 'Floptle %s\n\nDownload the floptle-hub archive for your platform; the Hub installs engine versions.\n' "$TAG" > NOTES.md
          fi

      # Archive of record on the private repo — always happens, and is what
      # scripts/publish-public.sh mirrors when RELEASES_TOKEN isn't set.
      - name: Archive on this repo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; REPO="${{ github.repository }}"
          shopt -s nullglob
          BUNDLES=(artifacts/*/floptle-*.tar.gz artifacts/*/floptle-*.zip)
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file NOTES.md || true
          gh release upload "$TAG" "${BUNDLES[@]}" releases.json docs.json --clobber --repo "$REPO"

      - name: Publish to the public releases repo
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASES_TOKEN:-}" ]; then
            echo "::warning::RELEASES_TOKEN not set — public publish skipped. Run scripts/publish-public.sh $GITHUB_REF_NAME locally to finish the release."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN"
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          BUNDLES=(artifacts/*/floptle-*.tar.gz artifacts/*/floptle-*.zip)
          gh release create "$TAG" --repo "$PUBLIC_REPO" --title "$TAG" --notes-file NOTES.md || true
          gh release upload "$TAG" "${BUNDLES[@]}" releases.json docs.json --clobber --repo "$PUBLIC_REPO"
          # A stable 'manifest' release so the Hub's default manifest URL always resolves to
          # the newest list (releases/download/manifest/releases.json). It's a PRERELEASE
          # and the version release is explicitly marked LATEST: GitHub otherwise crowns
          # the most recently CREATED release, which made /releases/latest land on the
          # manifest holder (a page with no downloads) instead of the real bundles.
          gh release create manifest --repo "$PUBLIC_REPO" --title "Release manifest" --prerelease --notes "Machine-readable version manifest for the Floptle Hub — not a download page. Get Floptle from the LATEST release instead." || true
          gh release upload manifest releases.json docs.json --clobber --repo "$PUBLIC_REPO"
          gh release edit manifest --repo "$PUBLIC_REPO" --prerelease
          case "$TAG" in *-*) ;; *) gh release edit "$TAG" --repo "$PUBLIC_REPO" --latest;; esac
