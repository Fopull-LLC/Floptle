# On-demand macOS engine binary for File ⏵ Export Game… (docs/export-builds.md).
# macOS can't be cross-compiled from Linux (Apple SDK licensing), so a real Mac
# runner builds it natively; the editor's export stamps Mac game builds from the
# downloaded binary at `prebuilt/floptle-macos` in the source checkout.
#
# workflow_dispatch only — macOS runner minutes bill at 10× on private repos, so
# this runs when you ask (Actions tab ⏵ macos-binary ⏵ Run workflow), not per push.
# `arm64` (default) covers Apple Silicon; `universal` also runs on old Intel Macs
# at roughly double the build minutes.
#
# `binary: player` builds the game player instead of the editor: what a Mac
# game build ships, for stamping one from a commit that has not been released.
name: macos-binary

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which Macs to support"
        type: choice
        default: arm64
        options: [arm64, universal]
      binary:
        description: "Which binary: the editor, or the game player"
        type: choice
        default: editor
        options: [editor, player]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      PKG: ${{ inputs.binary == 'player' && 'floptle-player' || 'floptle-editor' }}
      BIN: ${{ inputs.binary == 'player' && 'floptle-player' || 'floptle' }}
      OUT: ${{ inputs.binary == 'player' && 'floptle-player-macos' || 'floptle-macos' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon)
        run: cargo build --release -p "$PKG" --target aarch64-apple-darwin

      - name: Build (Intel)
        if: inputs.arch == 'universal'
        run: cargo build --release -p "$PKG" --target x86_64-apple-darwin

      # tar (not a bare file) so the executable bit survives the artifact zip.
      - name: Assemble
        run: |
          if [ "${{ inputs.arch }}" = "universal" ]; then
            lipo -create -output "$OUT" \
              "target/aarch64-apple-darwin/release/$BIN" \
              "target/x86_64-apple-darwin/release/$BIN"
          else
            cp "target/aarch64-apple-darwin/release/$BIN" "$OUT"
          fi
          chmod +x "$OUT"
          tar czf "$OUT.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}.tar.gz
